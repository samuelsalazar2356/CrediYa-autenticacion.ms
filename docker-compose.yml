services:
  postgres-db:
    image: postgres:16-alpine
    container_name: crediya-postgres-db
    restart: always
    environment:
      POSTGRES_DB: crediya_autenticacion
      POSTGRES_USER: crediya_user
      POSTGRES_PASSWORD: crediya_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
